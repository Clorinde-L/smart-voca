# 2026-11-11 - smart-voca - 패키지 정보와 pytest 설정
# 파일 위치: pyproject.toml

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvoca"
version = "0.1.0"
description = "토익 영단어 암기·시험 프로그램 (스마트 보카)"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src 배치이므로 설치하지 않아도 테스트가 smartvoca 를 찾게 한다
pythonpath = ["src"]
testpaths = ["tests"]
